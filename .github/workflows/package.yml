name: Build Packages

on:
  push:
    branches:
      - feat/pkg
    tags:
      - '*'

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            type: jvm
          - os: ubuntu-24.04-arm
            arch: aarch64
            type: jvm
          - os: windows-latest
            arch: amd64
            type: jvm
          - os: windows-11-arm
            arch: arm64
            type: jvm
          - os: macos-latest
            arch: aarch64
            type: jvm
          # Native image builds
          - os: ubuntu-latest
            arch: amd64
            type: native

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        if: matrix.type == 'jvm'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup GraalVM (native image)
        if: matrix.type == 'native'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community
          components: native-image

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build package
        if: matrix.type == 'jvm'
        run: ./gradlew package
        shell: bash

      - name: Build native image
        if: matrix.type == 'native'
        run: ./gradlew nativeCompile
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: |
            build/package/app/*.tar.gz
            build/package/app/*.zip
            build/native/nativeCompile/*.tar.gz
            build/native/nativeCompile/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Get project version
        id: version
        shell: bash
        run: |
          VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        id: timestamp
        shell: bash
        run: |
          echo "value=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Release packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}.${{ steps.timestamp.outputs.value }}
          name: ${{ steps.version.outputs.value }} Build ${{ steps.timestamp.outputs.value }}
          prerelease: true
          files: dist/**
